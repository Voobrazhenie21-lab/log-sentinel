[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log-sentinel"
version = "1.3.0"
description = "Zero-Dependency Python Threat Detection & SOC L1/L2 Incident Triage Engine"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "Aleksei Zharkou", email = "lyosha.zharkov.98@mail.ru"}
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
log-sentinel = "log_sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["log_sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
